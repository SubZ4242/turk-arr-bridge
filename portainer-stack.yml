version: "3.8"

# ============================================================
# Türk ARR Bridge - Portainer Stack
# ============================================================
# Torznab-Proxy der internationale Titel automatisch
# in türkische Originaltitel übersetzt.
#
# Nach dem Deploy in Sonarr/Radarr die Indexer-URL ändern:
#   ALT:  http://192.168.178.76:30196/api/v2.0/indexers/turktorrent/results/torznab/
#   NEU:  http://192.168.178.76:9696/torznab
# ============================================================

services:
  turk-arr-bridge:
    image: turk-arr-bridge:latest
    container_name: turk-arr-bridge
    restart: unless-stopped
    ports:
      - "9696:9696"
    environment:
      # Sonarr Konfiguration (Türk-Instanz auf Port 30199)
      SONARR_URL: "http://192.168.178.76:30199"
      SONARR_API_KEY: "e4a818c5f4b545f98704459811912fa7"
      
      # Radarr Konfiguration (Türk-Instanz auf Port 30095)
      RADARR_URL: "http://192.168.178.76:30095"
      RADARR_API_KEY: "157cffb2534a4171a84e36df111307e0"
      
      # Jackett Konfiguration
      JACKETT_URL: "http://192.168.178.76:30196"
      JACKETT_API_KEY: "9kyp7kl9ofqxa8r02mkvpr5msykqytzy"
      
      # Upstream: Das echte Jackett/TürkTorrent Torznab-Endpoint
      UPSTREAM_TORZNAB_URL: "http://192.168.178.76:30196/api/v2.0/indexers/turktorrent/results/torznab/"
      
      # Bridge Einstellungen
      BRIDGE_PORT: "9696"
      CACHE_TTL_SECONDS: "300"
      LOG_LEVEL: "INFO"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
